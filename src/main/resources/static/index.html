<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja Demo</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f4f4f4; }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
    section { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px; }
    form { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    input, select, button { padding: 6px; font-size: 14px; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; vertical-align: top; }
    th { background: #eee; }
    td button { padding: 2px 6px; font-size: 12px; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px; }
    #log { background: #222; color: #0f0; font-family: monospace; font-size: 12px;
           height: 220px; overflow-y: auto; padding: 8px; white-space: pre-wrap; }
    .err { color: #f66; }
  </style>
</head>
<body>
  <h1>Loja Demo — Frontend + Spring Boot</h1>
  <p>
    <button id="btnHello">Testar GET /cliente/hello</button>
    <button id="btnReload">Recarregar tudo</button>
    <span id="hello"></span>
  </p>

  <div class="grid">
    <section>
      <h2>Clientes</h2>
      <form id="formCliente">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Senha" required>
        <button type="submit">Criar cliente</button>
      </form>
      <table>
        <thead><tr><th>ID</th><th>Username</th><th></th></tr></thead>
        <tbody id="tblClientes"></tbody>
      </table>
    </section>

    <section>
      <h2>Produtos</h2>
      <form id="formProduto">
        <input name="produtoId" type="hidden">
        <input name="nome" placeholder="Nome" required>
        <input name="preco" type="number" step="0.01" placeholder="Preço" required>
        <input name="quantidade" type="number" placeholder="Quantidade" required>
        <button type="submit" id="btnProduto">Criar produto</button>
        <button type="button" id="btnCancelarEdicao" hidden>Cancelar edição</button>
      </form>
      <table>
        <thead><tr><th>ID</th><th>Nome</th><th>Preço</th><th>Qtd</th><th></th></tr></thead>
        <tbody id="tblProdutos"></tbody>
      </table>
    </section>

    <section>
      <h2>Pedidos</h2>
      <form id="formPedido">
        <select name="clienteId" id="selCliente" required></select>
        <div class="checks" id="chkProdutos"></div>
        <button type="submit">Criar pedido</button>
      </form>
      <table>
        <thead><tr><th>ID</th><th>Data</th><th>Cliente</th><th>Produtos</th><th>Status</th><th>Pagamento</th><th></th></tr></thead>
        <tbody id="tblPedidos"></tbody>
      </table>
    </section>

    <section>
      <h2>Pagamentos</h2>
      <form id="formPagamento">
        <select name="pedidoId" id="selPedido" required></select>
        <input name="valor" type="number" step="0.01" placeholder="Valor" required>
        <select name="metodo">
          <option>PIX</option>
          <option>CARTAO</option>
          <option>BOLETO</option>
        </select>
        <button type="submit">Registrar pagamento</button>
      </form>
      <table>
        <thead><tr><th>ID</th><th>Valor</th><th>Método</th><th>Status</th><th></th></tr></thead>
        <tbody id="tblPagamentos"></tbody>
      </table>
    </section>
  </div>

  <h2>Log de requisições</h2>
  <div id="log"></div>

  <script src="app.js"></script>
</body>
</html>
